# Debug workflow: tests if repository secrets work at all.
# Add a secret named DEBUG_SECRET with value "works" to test.
# Delete this file after debugging.
name: Debug secrets

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Test if secret exists
        run: |
          if [ -n "$DEBUG_SECRET" ]; then
            echo "SUCCESS: DEBUG_SECRET is set (length=${#DEBUG_SECRET})"
          else
            echo "FAIL: DEBUG_SECRET is empty - secrets not reaching workflow"
          fi
        env:
          DEBUG_SECRET: ${{ secrets.DEBUG_SECRET }}
